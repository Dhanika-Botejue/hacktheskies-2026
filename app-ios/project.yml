# Generate the Xcode project with:  ../tools/bin/xcodegen  (run inside app-ios/)
name: HackTheSkies
options:
  bundleIdPrefix: dev.hacktheskies2026
  deploymentTarget:
    iOS: "17.0"
targets:
  HackTheSkies:
    type: application
    platform: iOS
    sources: [HackTheSkies]
    info:
      path: HackTheSkies/Info.plist
      properties:
        CFBundleDisplayName: HackTheSkies
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: The camera is used to scan the play area into a 3D map.
        NSLocalNetworkUsageDescription: Scans are uploaded to the host laptop on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.hacktheskies2026.app
            CFBundleURLSchemes: [hacktheskies]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hacktheskies2026.app
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
